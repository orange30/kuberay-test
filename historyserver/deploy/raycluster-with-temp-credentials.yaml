apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: raycluster-demo
  namespace: mce-proj-production-009
spec:
  rayVersion: '2.9.0'
  
  # ==================== Head 配置 ====================
  headGroupSpec:
    serviceType: ClusterIP
    rayStartParams:
      dashboard-host: '0.0.0.0'
      num-cpus: '0'
    template:
      spec:
        serviceAccountName: ray-cluster
        containers:
        - name: ray-head
          image: rayproject/ray:2.9.0
          ports:
          - containerPort: 6379
            name: gcs-server
          - containerPort: 8265
            name: dashboard
          - containerPort: 10001
            name: client
          
          env:
          # ==================== COS 配置 ====================
          # ✅ 1. COS Bucket URL
          - name: COS_BUCKET_URL
            value: "https://zhikuodu-1255429800.cos.ap-guangzhou.myqcloud.com"
          
          # ✅ 2. 临时密钥 Secret ID
          - name: COS_SECRET_ID
            valueFrom:
              secretKeyRef:
                name: cos-secret-proj-production-009
                key: secret-id
          
          # ✅ 3. 临时密钥 Secret Key
          - name: COS_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: cos-secret-proj-production-009
                key: secret-key
          
          # ✅ 4. 临时密钥 Session Token（新增！）
          - name: COS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: cos-secret-proj-production-009
                key: session-token
                optional: true  # 兼容永久密钥场景
          
          # ==================== Collector 配置 ====================
          - name: RAY_CLUSTER_NAME
            value: "raycluster-demo"
          - name: RAY_CLUSTER_ID
            value: "demo-001"
          
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
            requests:
              cpu: "1"
              memory: "2Gi"
          
          volumeMounts:
          - name: log-volume
            mountPath: /tmp/ray
          - name: collector-config
            mountPath: /var/collector-config
        
        # ==================== Init Container: Collector ====================
        initContainers:
        - name: collector
          image: ccr.ccs.tencentyun.com/use-test/ray:collector-latest
          command:
          - collector
          - --runtime-class-name=cos
          - --ray-cluster-name=raycluster-demo
          - --ray-cluster-id=demo-001
          - --ray-root-dir=mce-proj-production-009
          - --role=Head
          - --push-interval=1m
          - --runtime-class-config-path=/var/collector-config/data
          
          env:
          # ✅ Collector 也需要相同的 COS 配置
          - name: COS_BUCKET_URL
            value: "https://zhikuodu-1255429800.cos.ap-guangzhou.myqcloud.com"
          - name: COS_SECRET_ID
            valueFrom:
              secretKeyRef:
                name: cos-secret-proj-production-009
                key: secret-id
          - name: COS_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: cos-secret-proj-production-009
                key: secret-key
          # ✅ Collector 临时密钥 Token
          - name: COS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: cos-secret-proj-production-009
                key: session-token
                optional: true
          
          volumeMounts:
          - name: log-volume
            mountPath: /tmp/ray
          - name: collector-config
            mountPath: /var/collector-config
        
        volumes:
        - name: log-volume
          emptyDir: {}
        - name: collector-config
          configMap:
            name: collector-config
            defaultMode: 420
  
  # ==================== Worker 配置 ====================
  workerGroupSpecs:
  - replicas: 2
    minReplicas: 1
    maxReplicas: 5
    groupName: worker-group
    rayStartParams:
      num-cpus: '4'
    template:
      spec:
        serviceAccountName: ray-cluster
        containers:
        - name: ray-worker
          image: rayproject/ray:2.9.0
          
          env:
          # ==================== COS 配置 ====================
          # ✅ Worker 也需要完整的 COS 配置
          - name: COS_BUCKET_URL
            value: "https://zhikuodu-1255429800.cos.ap-guangzhou.myqcloud.com"
          - name: COS_SECRET_ID
            valueFrom:
              secretKeyRef:
                name: cos-secret-proj-production-009
                key: secret-id
          - name: COS_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: cos-secret-proj-production-009
                key: secret-key
          # ✅ Worker 临时密钥 Token
          - name: COS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: cos-secret-proj-production-009
                key: session-token
                optional: true
          
          # ==================== Collector 配置 ====================
          - name: RAY_CLUSTER_NAME
            value: "raycluster-demo"
          - name: RAY_CLUSTER_ID
            value: "demo-001"
          
          resources:
            limits:
              cpu: "4"
              memory: "8Gi"
            requests:
              cpu: "2"
              memory: "4Gi"
          
          volumeMounts:
          - name: log-volume
            mountPath: /tmp/ray
          - name: collector-config
            mountPath: /var/collector-config
        
        # ==================== Init Container: Collector ====================
        initContainers:
        - name: collector
          image: ccr.ccs.tencentyun.com/use-test/ray:collector-latest
          command:
          - collector
          - --runtime-class-name=cos
          - --ray-cluster-name=raycluster-demo
          - --ray-cluster-id=demo-001
          - --ray-root-dir=mce-proj-production-009
          - --role=Worker
          - --push-interval=1m
          - --runtime-class-config-path=/var/collector-config/data
          
          env:
          # ✅ Worker Collector 的 COS 配置
          - name: COS_BUCKET_URL
            value: "https://zhikuodu-1255429800.cos.ap-guangzhou.myqcloud.com"
          - name: COS_SECRET_ID
            valueFrom:
              secretKeyRef:
                name: cos-secret-proj-production-009
                key: secret-id
          - name: COS_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: cos-secret-proj-production-009
                key: secret-key
          # ✅ Worker Collector 临时密钥 Token
          - name: COS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: cos-secret-proj-production-009
                key: session-token
                optional: true
          
          volumeMounts:
          - name: log-volume
            mountPath: /tmp/ray
          - name: collector-config
            mountPath: /var/collector-config
        
        volumes:
        - name: log-volume
          emptyDir: {}
        - name: collector-config
          configMap:
            name: collector-config
            defaultMode: 420

---
# ==================== Collector ConfigMap ====================
apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-config
  namespace: mce-proj-production-009
data:
  data: |
    {
      "cosBucketURL": "https://zhikuodu-1255429800.cos.ap-guangzhou.myqcloud.com"
    }
