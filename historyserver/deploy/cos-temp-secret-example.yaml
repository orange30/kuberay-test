---
# 示例 1: 使用永久密钥的 Secret（现有方式，保持兼容）
apiVersion: v1
kind: Secret
metadata:
  name: cos-secret-proj-production-009
  namespace: mce-proj-production-009
type: Opaque
data:
  # 永久 SecretID (Base64 编码)
  secret-id: QUtJRFZyOEdEeVduekE4dFBpc29XekRMSzdpNUQ3ck5majlB  # 示例值
  # 永久 SecretKey (Base64 编码)
  secret-key: VGhwa1IwTVVRODZ3WjNKTERzSlZVR243RDZwV0dwQko=      # 示例值
  # 注意: 永久密钥不需要 session-token 字段

---
# 示例 2: 使用临时密钥的 Secret（新方式）
apiVersion: v1
kind: Secret
metadata:
  name: cos-secret-proj-production-009-temp
  namespace: mce-proj-production-009
type: Opaque
data:
  # 临时 SecretID (Base64 编码)
  # 格式: echo -n "AKID***-临时" | base64
  secret-id: QUtJRCoqKi3kuLTml7Y=
  
  # 临时 SecretKey (Base64 编码)
  # 格式: echo -n "****-临时" | base64
  secret-key: KioqKi3kuLTml7Y=
  
  # 🆕 临时 Token (Base64 编码)
  # 格式: echo -n "临时token字符串" | base64
  session-token: 5Lil5pe25bCH5L6LKioq

---
# Secret 创建说明
# 
# 1. 获取临时密钥（使用腾讯云 STS 服务）
#    临时密钥包含三个字段：
#    - TmpSecretId: 临时 SecretID
#    - TmpSecretKey: 临时 SecretKey
#    - Token: 临时 Token
#
# 2. Base64 编码
#    echo -n "你的临时SecretID" | base64
#    echo -n "你的临时SecretKey" | base64
#    echo -n "你的临时Token" | base64
#
# 3. 创建 Secret
#    kubectl create secret generic cos-secret-proj-production-009 \
#      --from-literal=secret-id="临时SecretID" \
#      --from-literal=secret-key="临时SecretKey" \
#      --from-literal=session-token="临时Token" \
#      -n mce-proj-production-009
#
# 4. 更新现有 Secret（如果已存在）
#    kubectl create secret generic cos-secret-proj-production-009 \
#      --from-literal=secret-id="临时SecretID" \
#      --from-literal=secret-key="临时SecretKey" \
#      --from-literal=session-token="临时Token" \
#      -n mce-proj-production-009 \
#      --dry-run=client -o yaml | kubectl apply -f -

---
# 临时密钥有效期说明
#
# - 临时密钥通常有效期为 2 小时
# - 过期后需要重新获取并更新 Secret
# - 建议使用自动化工具定期刷新 Secret（如 CronJob）
