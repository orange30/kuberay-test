apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: raycluster-demo
  namespace: mce-proj-production-009
spec:
  rayVersion: '2.9.0'
  
  # ==================== Head 配置 ====================
  headGroupSpec:
    serviceType: ClusterIP
    rayStartParams:
      dashboard-host: '0.0.0.0'
      num-cpus: '0'
    template:
      spec:
        serviceAccountName: ray-cluster
        
        # ✅ Volume 定义：挂载 Secret 为文件
        volumes:
        - name: cos-credentials
          secret:
            secretName: cos-secret-proj-production-009
            items:
            - key: secret-id
              path: secret-id
            - key: secret-key
              path: secret-key
            - key: session-token
              path: session-token
        - name: log-volume
          emptyDir: {}
        - name: collector-config
          configMap:
            name: collector-config
        
        containers:
        - name: ray-head
          image: rayproject/ray:2.9.0
          ports:
          - containerPort: 6379
            name: gcs-server
          - containerPort: 8265
            name: dashboard
          - containerPort: 10001
            name: client
          
          env:
          # ==================== COS 配置（使用文件方式）====================
          - name: COS_BUCKET_URL
            value: "https://zhikuodu-1255429800.cos.ap-guangzhou.myqcloud.com"
          # ✅ 使用 *_FILE 环境变量指向挂载的文件
          - name: COS_SECRET_ID_FILE
            value: /etc/cos-credentials/secret-id
          - name: COS_SECRET_KEY_FILE
            value: /etc/cos-credentials/secret-key
          - name: COS_SESSION_TOKEN_FILE
            value: /etc/cos-credentials/session-token
          
          # ==================== Ray 配置 ====================
          - name: RAY_CLUSTER_NAME
            value: "raycluster-demo"
          - name: RAY_CLUSTER_ID
            value: "demo-001"
          
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
            requests:
              cpu: "1"
              memory: "2Gi"
          
          volumeMounts:
          - name: log-volume
            mountPath: /tmp/ray
          - name: collector-config
            mountPath: /var/collector-config
          # ✅ 挂载凭证文件
          - name: cos-credentials
            mountPath: /etc/cos-credentials
            readOnly: true
        
        # ==================== Init Container: Collector ====================
        initContainers:
        - name: collector
          image: ccr.ccs.tencentyun.com/use-test/ray:collector-m011
          command:
          - collector
          - --runtime-class-name=cos
          - --ray-cluster-name=raycluster-demo
          - --ray-cluster-id=demo-001
          - --ray-root-dir=mce-proj-production-009
          - --role=Head
          - --push-interval=1m
          - --runtime-class-config-path=/var/collector-config/data
          
          env:
          # ✅ Head Collector 使用文件方式读取凭证
          - name: COS_BUCKET_URL
            value: "https://zhikuodu-1255429800.cos.ap-guangzhou.myqcloud.com"
          - name: COS_SECRET_ID_FILE
            value: /etc/cos-credentials/secret-id
          - name: COS_SECRET_KEY_FILE
            value: /etc/cos-credentials/secret-key
          - name: COS_SESSION_TOKEN_FILE
            value: /etc/cos-credentials/session-token
          
          # ✅ 新增：凭证重新加载间隔（默认 5 分钟）
          - name: COLLECTOR_CREDENTIAL_RELOAD_INTERVAL
            value: 5m
          
          volumeMounts:
          - name: log-volume
            mountPath: /tmp/ray
          - name: collector-config
            mountPath: /var/collector-config
          # ✅ 挂载凭证文件
          - name: cos-credentials
            mountPath: /etc/cos-credentials
            readOnly: true
  
  # ==================== Worker 配置 ====================
  workerGroupSpecs:
  - replicas: 2
    minReplicas: 1
    maxReplicas: 5
    groupName: worker-group
    rayStartParams:
      num-cpus: '4'
    template:
      spec:
        serviceAccountName: ray-cluster
        
        # ✅ Worker 也需要挂载凭证
        volumes:
        - name: cos-credentials
          secret:
            secretName: cos-secret-proj-production-009
            items:
            - key: secret-id
              path: secret-id
            - key: secret-key
              path: secret-key
            - key: session-token
              path: session-token
        - name: log-volume
          emptyDir: {}
        - name: collector-config
          configMap:
            name: collector-config
        
        containers:
        - name: ray-worker
          image: rayproject/ray:2.9.0
          
          env:
          # ==================== Worker COS 配置 ====================
          - name: COS_BUCKET_URL
            value: "https://zhikuodu-1255429800.cos.ap-guangzhou.myqcloud.com"
          - name: COS_SECRET_ID_FILE
            value: /etc/cos-credentials/secret-id
          - name: COS_SECRET_KEY_FILE
            value: /etc/cos-credentials/secret-key
          - name: COS_SESSION_TOKEN_FILE
            value: /etc/cos-credentials/session-token
          
          # ==================== Collector 配置 ====================
          - name: RAY_CLUSTER_NAME
            value: "raycluster-demo"
          - name: RAY_CLUSTER_ID
            value: "demo-001"
          
          resources:
            limits:
              cpu: "4"
              memory: "8Gi"
            requests:
              cpu: "2"
              memory: "4Gi"
          
          volumeMounts:
          - name: log-volume
            mountPath: /tmp/ray
          - name: collector-config
            mountPath: /var/collector-config
          # ✅ 挂载凭证文件
          - name: cos-credentials
            mountPath: /etc/cos-credentials
            readOnly: true
        
        # ==================== Init Container: Worker Collector ====================
        initContainers:
        - name: collector
          image: ccr.ccs.tencentyun.com/use-test/ray:collector-m011
          command:
          - collector
          - --runtime-class-name=cos
          - --ray-cluster-name=raycluster-demo
          - --ray-cluster-id=demo-001
          - --ray-root-dir=mce-proj-production-009
          - --role=Worker
          - --push-interval=1m
          - --runtime-class-config-path=/var/collector-config/data
          
          env:
          # ✅ Worker Collector 使用文件方式读取凭证
          - name: COS_BUCKET_URL
            value: "https://zhikuodu-1255429800.cos.ap-guangzhou.myqcloud.com"
          - name: COS_SECRET_ID_FILE
            value: /etc/cos-credentials/secret-id
          - name: COS_SECRET_KEY_FILE
            value: /etc/cos-credentials/secret-key
          - name: COS_SESSION_TOKEN_FILE
            value: /etc/cos-credentials/session-token
          
          # ✅ 新增：凭证重新加载间隔
          - name: COLLECTOR_CREDENTIAL_RELOAD_INTERVAL
            value: 5m
          
          volumeMounts:
          - name: log-volume
            mountPath: /tmp/ray
          - name: collector-config
            mountPath: /var/collector-config
          # ✅ 挂载凭证文件
          - name: cos-credentials
            mountPath: /etc/cos-credentials
            readOnly: true

---
# ==================== Collector ConfigMap ====================
apiVersion: v1
kind: ConfigMap
metadata:
  name: collector-config
  namespace: mce-proj-production-009
data:
  data: |
    {
      "cosBucketURL": "https://zhikuodu-1255429800.cos.ap-guangzhou.myqcloud.com"
    }
